services:
  # MongoDB database
  mongodb:
    image: mongo:7.0
    container_name: tiffin-service-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - tiffin-service-mongodb-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application (Express API + served React build)
  app:
    build: .
    container_name: tiffin-service-app
    restart: unless-stopped
    ports:
      - '5000:5000'
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/tiffin-service
      # Non-default secrets so the production env validator passes.
      # Override these with real values for actual deployments.
      - JWT_SECRET=local-dev-jwt-secret-tiffin-2026
      - JWT_REFRESH_SECRET=local-dev-jwt-refresh-secret-tiffin-2026
      - JWT_EXPIRES_IN=30d
      - JWT_REFRESH_EXPIRES_IN=90d
      - CLIENT_URL=http://localhost:3000
      - API_VERSION=v1
      - LOG_LEVEL=info
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=100
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  tiffin-service-mongodb-data:
