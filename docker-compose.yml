services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://host.docker.internal:27017/tiffin-service
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
